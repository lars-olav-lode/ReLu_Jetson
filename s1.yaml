# Stasjon 1 — IKKE ved vinduene
# Porter:    ls /dev/serial/by-id/   (eller lerobot-find-port)
# Kameraer:  lerobot-find-cameras opencv
station: s1
location: ikke ved vinduene
fps: 30

robot:
  type: so101_follower
  id: follower_s1
  port: /dev/ttyACM0
  # calibration_dir: ~/ReLu-Robot-Lab/calibration/robots/so101_follower   # bare hvis filene ikke ligger i standardmappen
  cameras:
    front: {type: opencv, index_or_path: /dev/video0, width: 640, height: 480, fps: 30}
    wrist: {type: opencv, index_or_path: /dev/video2, width: 640, height: 480, fps: 30}

teleop:
  type: so101_leader
  id: leader_s1
  port: /dev/ttyACM1
  # calibration_dir: ~/ReLu-Robot-Lab/calibration/teleoperators/so101_leader
